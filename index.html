<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6f2b82"><link rel="icon" type="image/png" href="images/Benevolent_transparent_icon.png">
<title>Authorization Overlap Check</title>
<style>
:root{--purple:#742d86;--deep:#3e1649;--soft:#f5eef8;--ink:#241b29;--muted:#746a78;--line:#e9e1eb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% -10%,rgba(123,52,143,.13),transparent 28rem),#faf8fb;min-height:100vh}
.shell{width:min(1100px,calc(100% - 28px));margin:0 auto}header{padding:22px 0 8px;display:flex;align-items:center;justify-content:space-between}header img{width:210px;max-width:55vw;height:auto}h1{margin:18px 0 4px;font-size:clamp(28px,4.5vw,40px);letter-spacing:-.03em;color:var(--deep)}.sub{color:var(--muted);font-size:14px;margin:0 0 20px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 32px rgba(53,27,59,.06);padding:22px;margin-bottom:18px}.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:2px dashed #d9cddd;border-radius:18px;padding:30px 16px;text-align:center;cursor:pointer;transition:.2s}.drop:hover,.drop.over{border-color:var(--purple);background:var(--soft)}.drop b{color:var(--deep);font-size:17px}.drop span{color:var(--muted);font-size:13px}.btn{appearance:none;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px;cursor:pointer;background:var(--purple);color:#fff}.btn:hover{background:#572064}.btn.ghost{background:var(--soft);color:var(--purple)}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.label{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--purple);margin-bottom:6px}.subject{font-size:16px;font-weight:600}#emailBox{border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px;overflow-x:auto;background:#fff}.status{font-size:14px;color:var(--muted)}.err{color:#b00020;font-weight:600}.ok{color:#1b7f3b;font-weight:700}.hidden{display:none}footer{color:#a094a4;font-size:11px;text-align:center;padding:26px 0 40px}.copied{background:#1b7f3b!important;color:#fff!important}.stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}.stat{background:var(--soft);padding:12px 16px;border-radius:12px;font-size:13px}.stat strong{display:block;color:var(--deep);font-size:22px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #e9e1eb;text-align:left;padding:9px;vertical-align:top}th{background:#f5eef8;color:#3e1649;white-space:nowrap}.group{margin:18px 0 8px;font-weight:700;color:#3e1649}.hint{font-size:12px;color:#746a78;margin:8px 0}.pill{display:inline-block;border-radius:8px;padding:3px 7px;background:#fff1d6;color:#784d00;font-weight:600}.pill.high{background:#ffe6e6;color:#a21d27}@media(max-width:600px){.card{padding:16px}.stat{flex:1 1 40%}table{font-size:12px}}
</style></head><body><div class="shell"><header><img src="images/Benevolent_transparent_logo.png" alt="Benevolent Home Care" onerror="this.style.display='none'"></header>
<h1>Authorization Overlap Check</h1><p class="sub">Upload the active authorizations CSV to find patients with more than one currently active, overlapping authorization. Files stay on your computer.</p>
<div class="card"><label class="drop" id="drop"><b>Choose file or drop it here</b><span>.csv</span><input id="file" type="file" accept=".csv,text/csv" class="hidden"></label><div id="status" class="status" style="margin-top:12px"></div></div>
<div id="results" class="hidden"><div class="card"><div class="row"><div><div class="label">Subject</div><div class="subject" id="subject"></div></div><button class="btn ghost" id="copySubject">Copy subject</button></div></div><div class="card"><div class="row"><div class="label" style="margin:0">Email</div><button class="btn" id="copyBody">Copy for email</button></div><div id="emailBox"></div></div></div>
<footer>A Davidowitz Project © <span id="yr">2026</span> · Authorization Overlap Check v3</footer></div>
<script>
'use strict';
const $=id=>document.getElementById(id);$('yr').textContent=new Date().getFullYear();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')quoted=false;else cell+=c}else if(c==='"')quoted=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw Error('CSV contains an unclosed quotation mark.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows}
const normalize=s=>String(s??'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function dateValue(s){s=String(s??'').trim();let m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m)return validDate(+m[3],+m[1],+m[2]);m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);if(m)return validDate(+m[1],+m[2],+m[3]);return null}
function validDate(y,m,d){let t=Date.UTC(y,m-1,d),x=new Date(t);return x.getUTCFullYear()===y&&x.getUTCMonth()===m-1&&x.getUTCDate()===d?t:null}
function overlap(a,b){if(a.fromN===null||a.toN===null||b.fromN===null||b.toN===null)return null;return a.fromN<=b.toN&&b.fromN<=a.toN}
function analyze(csv){
 const matrix=parseCSV(csv);if(matrix.length<2)throw Error('No authorization records found.');
 const header=matrix[0].map(x=>x.trim().toLowerCase().replace(/[^a-z0-9]/g,''));
 const fields=['PrimaryContract','FirstName','LastName','AdmissionID','Status','AuthFromDate','AuthToDate'],idx={};
 for(const field of fields){idx[field]=header.indexOf(field.toLowerCase());if(idx[field]<0)throw Error('Missing required column: '+field)}
 const data=matrix.slice(1).map((r,i)=>{let v=n=>(r[idx[n]]??'').trim();let first=v('FirstName'),last=v('LastName'),id=v('AdmissionID'),from=v('AuthFromDate'),to=v('AuthToDate');return {row:i+2,first,last,name:[first,last].filter(Boolean).join(' '),id,contract:v('PrimaryContract'),status:v('Status'),from,to,fromN:dateValue(from),toN:dateValue(to),nameKey:normalize(first)+'|'+normalize(last),idKey:normalize(id)}});
 const today=new Date(),todayN=Date.UTC(today.getFullYear(),today.getMonth(),today.getDate());
 const invalid=data.filter(r=>r.fromN===null||r.toN===null||r.fromN>r.toN);
 const active=data.filter(r=>r.fromN!==null&&r.toN!==null&&r.fromN<=todayN&&r.toN>=todayN);
 // Union records linked by the same admission ID or by the same first/last name.
 const parent=active.map((_,i)=>i);function root(i){while(parent[i]!==i){parent[i]=parent[parent[i]];i=parent[i]}return i}function join(a,b){a=root(a);b=root(b);if(a!==b)parent[b]=a}
 const byId=new Map(),byName=new Map();active.forEach((r,i)=>{if(r.idKey){if(byId.has(r.idKey))join(i,byId.get(r.idKey));else byId.set(r.idKey,i)}if(r.first&&r.last){if(byName.has(r.nameKey))join(i,byName.get(r.nameKey));else byName.set(r.nameKey,i)}});
 const sets=new Map();active.forEach((r,i)=>{const k=root(i);if(!sets.has(k))sets.set(k,[]);sets.get(k).push(r)});
 const groups=[...sets.values()].filter(g=>g.length>1).map(records=>{let pairs=[],sameId=false,sameNameDifferentId=false;for(let i=0;i<records.length;i++)for(let j=i+1;j<records.length;j++){const a=records[i],b=records[j];const idMatch=!!a.idKey&&a.idKey===b.idKey;const nameMatch=!!a.first&&!!a.last&&a.nameKey===b.nameKey;if(!idMatch&&!nameMatch)continue;if(!overlap(a,b))continue;pairs.push([a,b]);if(idMatch)sameId=true;if(nameMatch&&a.idKey!==b.idKey)sameNameDifferentId=true}return {records: [...new Set(pairs.flat())].sort((a,b)=>a.fromN-b.fromN),types:[...(sameId?['Same Admission ID']:[]),...(sameNameDifferentId?['Same name, different Admission IDs']:[])],anyOverlap:pairs.length>0,pairCount:pairs.length}}).filter(g=>g.anyOverlap).sort((a,b)=>(a.records[0].name||'').localeCompare(b.records[0].name||''));
 return {data,active,groups,invalid,today:today.toLocaleDateString('en-US')};
}
function render(result,fileName){const {data,active,groups,invalid,today}=result;const flagged=new Set(groups.flatMap(g=>g.records.map(r=>r.row)));const subject=`Authorization Overlap Check - ${groups.length} potential conflict${groups.length===1?'':'s'} - ${today}`;$('subject').textContent=subject;

let html=`<div style="font-family:Arial,Helvetica,sans-serif;color:#241b29;font-size:13px;line-height:1.5"><p>Please review the overlapping active authorizations below and confirm whether the previous authorization should have been ended.</p>`;
if(!groups.length)html+='<p style="color:#1b7f3b"><b>No overlapping active authorizations were found for matching Admission IDs or patient names.</b></p>';
else for(let i=0;i<groups.length;i++){const g=groups[i];html+=`<p style="margin:20px 0 7px"><b>${i+1}. ${esc(g.records[0].name||'Patient name unavailable')}</b> · ${esc(g.types.join(' / '))}</p><table style="border-collapse:collapse;width:100%;font-size:12px"><thead><tr>${['Patient name','Admission ID','Contract','Auth From','Auth To'].map(x=>`<th style="border:1px solid #ded5e1;background:#f5eef8;text-align:left;padding:8px">${x}</th>`).join('')}</tr></thead><tbody>${g.records.map(r=>`<tr>${[r.name,r.id,r.contract,r.from,r.to].map(x=>`<td style="border:1px solid #ded5e1;padding:8px">${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
if(invalid.length)html+=`<p style="margin-top:18px"><b>Date validation:</b> ${invalid.length} row(s) have missing, invalid, or reversed dates and could not be reliably checked. CSV rows: ${invalid.map(r=>r.row).join(', ')}.</p>`;
html+='</div>';$('emailBox').innerHTML=html;$('results').classList.remove('hidden');$('results').scrollIntoView({behavior:'smooth',block:'start'})}
async function load(file){if(!file)return;$('results').classList.add('hidden');$('status').className='status';$('status').textContent='Checking '+file.name+'...';try{if(!/\.csv$/i.test(file.name))throw Error('Please upload the Active Authorizations CSV file.');const text=await file.text(),res=analyze(text);render(res,file.name);$('status').className='status ok';$('status').textContent=`Checked ${res.data.length} records from ${file.name}. ${res.groups.length} potential overlap group(s) found.`}catch(e){$('status').className='status err';$('status').textContent=e.message||'Unable to read this file.'}}
$('file').addEventListener('change',e=>load(e.target.files[0]));const drop=$('drop');for(const event of ['dragenter','dragover'])drop.addEventListener(event,e=>{e.preventDefault();drop.classList.add('over')});for(const event of ['dragleave','drop'])drop.addEventListener(event,e=>{e.preventDefault();drop.classList.remove('over')});drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
function plainText(){const box=$('emailBox');return box.innerText||box.textContent||''}
async function copyRich(){const html=$('emailBox').innerHTML;const text=plainText();if(navigator.clipboard&&window.ClipboardItem){try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);return}catch(e){}}const temp=document.createElement('div');temp.innerHTML=html;temp.style.position='fixed';temp.style.left='-10000px';document.body.appendChild(temp);const range=document.createRange();range.selectNodeContents(temp);const selection=window.getSelection();selection.removeAllRanges();selection.addRange(range);const success=document.execCommand('copy');selection.removeAllRanges();temp.remove();if(!success)throw Error('Copy failed. Select the email contents manually.')}
function flash(button){const label=button.textContent;button.textContent='Copied!';button.classList.add('copied');setTimeout(()=>{button.textContent=label;button.classList.remove('copied')},1700)}
$('copySubject').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('subject').textContent);flash($('copySubject'))}catch(e){alert('Please select and copy the subject manually.')}});
$('copyBody').addEventListener('click',async()=>{try{await copyRich();flash($('copyBody'))}catch(e){alert(e.message)}});
</script></body></html>
